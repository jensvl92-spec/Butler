name: "Butler MCP Proxy"
version: "1.2.0"
slug: "butler_crew"
description: "MCP Proxy Server for Butler AI - provides HA tools via HTTP for remote agent access."
url: "https://github.com/jensvl92-spec/Butler"
startup: application
arch:
  - aarch64
  - amd64
init: false
map:
  - config:rw
options:
  mcp_token: ""
  mcp_server_url: "http://homeassistant.local:8123/api/mcp"
  cloudflare_tunnel_token: ""
  log_level: "info"
schema:
  mcp_token: str
  mcp_server_url: str
  cloudflare_tunnel_token: str?
  log_level: list(debug|info|warning|error)
ports:
  8000/tcp: 8000
