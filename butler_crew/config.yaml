name: "Butler Crew Proxy"
version: "1.1.0"
slug: "butler_crew"
description: "AI-Powered Proxy Server interacting with Home Assistant via MCP."
url: "https://github.com/jensvl92-spec/Butler"
startup: application
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
map:
  - config:rw
options:
  mcp_token: ""
  mcp_server_url: "http://homeassistant.local:8123/api/mcp"
  log_level: "info"
schema:
  mcp_token: str
  mcp_server_url: str
  log_level: list(debug, info, warning, error)
ports:
  8000/tcp: 8000
