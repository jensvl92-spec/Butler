[project]
name = "butler-crew"
version = "1.0.2"
description = "Multi-agent Home Assistant butler using CrewAI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.100.0",
    "litellm>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "supabase>=2.16.0",
    "googlemaps>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/butler_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
